<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>多端影视点播系统</title>
    <style>
        :root {
            --primary-color: #409eff;
            --danger-color: #ff4d4d;
            --text-dark: #1a1a1a;
            --text-light: #666;
            --bg-light: #f0f2f5;
            --container-padding: 20px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: var(--container-padding);
        }

        /* 搜索容器 */
        .search-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 1440px;
            padding: 0 var(--container-padding);
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .search-container.has-result {
            position: static;
            transform: none;
            margin: 30px auto 0;
            padding: 0 var(--container-padding);
        }

        .search-box {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        #searchInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e3e6;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            -webkit-appearance: none;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(64, 158, 255, 0.2);
        }

        .search-btn {
            padding: 12px 32px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #66b1ff;
        }

        /* 视频列表布局 */
        .video-grid {
            display: none;
            gap: 10px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            margin-top: 30px;
        }

        @media (min-width: 320px) { .video-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; } }
        @media (min-width: 600px) { .video-grid { grid-template-columns: repeat(4, 1fr); gap: 10px; } }
        @media (min-width: 900px) { .video-grid { grid-template-columns: repeat(5, 1fr); } }
        @media (min-width: 1200px) { .video-grid { grid-template-columns: repeat(6, 1fr); } }

        /* 视频卡片样式 */
        .video-card {
            background: white;
            overflow: hidden;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .video-card:hover {
            transform: translateY(-3px);
        }

        .poster-container {
            position: relative;
            width: 100%;
            padding-top: 130%;
            overflow: hidden;
        }

        .video-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .video-poster:hover {
            transform: scale(1.05);
        }

        .video-info {
            padding: 4px 0;
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .video-title {
            font-size: 13px;
            font-weight: 600;
            margin: 0;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
        }

        .video-status {
            font-size: 11px;
            color: var(--text-light);
            line-height: 1.2;
            padding: 2px 4px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 加载提示 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: var(--primary-color);
            z-index: 9999;
            display: none;
        }

        /* 播放器界面 */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            z-index: 1000;
            overflow-y: auto;
        }

        .player-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 16px;
        }

        .close-btn {
            padding: 10px 20px;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .current-title {
            color: white;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
        }

        #videoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* 选集面板 */
        .episode-panel {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .episode-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .episode-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .episode-btn.active {
            background: var(--primary-color);
        }

        /* 错误提示 */
        .error-message {
            text-align: center;
            padding: 40px 0;
            color: var(--danger-color);
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">加载中...</div>
    
    <div class="search-container" id="searchContainer">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入影视名称">
            <button class="search-btn" onclick="searchVideos()">搜索</button>
        </div>
    </div>

    <div class="container">
        <div class="video-grid" id="videoContainer"></div>
    </div>

    <div class="player-overlay" id="playerOverlay">
        <div class="player-container">
            <div class="player-header">
                <button class="close-btn" onclick="closePlayer()">返回</button>
                <div class="current-title" id="currentTitle"></div>
            </div>
            <div class="video-wrapper">
                <video id="videoPlayer" controls></video>
            </div>
            <div class="episode-panel">
                <div class="episode-list" id="episodeList"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>

    <script>
    let currentHls = null;

    // XML解析器
    function parseXML(xmlString) {
        try {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "text/xml");
            return Array.from(xmlDoc.querySelectorAll('video')).map(video => {
                const getText = selector => video.querySelector(selector)?.textContent.trim() || '';
                
                const playLinks = [];
                const ddNode = video.querySelector('dd');
                let year = getText('year');
                let lastEpisode = '';

                if (ddNode) {
                    const parts = ddNode.textContent.split(/\$\$\$|#/);
                    parts.forEach(part => {
                        const [name, url] = part.split('$').filter(Boolean);
                        if (url && url.includes('m3u8')) {
                            playLinks.push({
                                name: name?.trim() || '高清源',
                                url: url.trim()
                            });
                            lastEpisode = name?.trim() || '';
                        }
                    });
                }

                let statusText = year;
                if (playLinks.length > 1) {
                    const hasEpisode = lastEpisode.includes('集');
                    statusText = hasEpisode ? 
                        `更新至${lastEpisode.replace('第','').replace('集','')}集` : 
                        `更新至${lastEpisode}`;
                } else if (playLinks.length === 1) {
                    statusText = year || '未知年份';
                }

                return {
                    title: getText('name'),
                    statusText,
                    cover: getText('pic') || 'https://placehold.co/400x560?text=封面加载失败',
                    playLinks
                };
            }).filter(v => v.playLinks.length > 0);
        } catch (error) {
            return [];
        }
    }

    // 搜索功能
    async function searchVideos() {
        window.scrollTo(0, 0); // 新增：滚动到顶部
        const loadingOverlay = document.getElementById('loadingOverlay');
        const container = document.getElementById('videoContainer');
        const videoGrid = document.getElementById('videoContainer');
        const searchContainer = document.getElementById('searchContainer');
        const keyword = document.getElementById('searchInput').value.trim();
        
        try {
            loadingOverlay.style.display = 'flex';
            container.innerHTML = '';
            videoGrid.style.display = 'none';

            if (!keyword) throw new Error('请输入搜索内容');

            // 修改API参数获取全部结果
            const response = await fetch(`https://cj.lziapi.com/api.php/provide/vod/from/lzm3u8/at/xml/?ac=detail&wd=${encodeURIComponent(keyword)}`);
            if (!response.ok) throw new Error('请求失败');
            
            const videos = parseXML(await response.text());
            if (videos.length === 0) throw new Error('未找到相关内容');

            // 调整搜索框样式
            searchContainer.classList.add('has-result');
            videoGrid.style.display = 'grid';
            renderVideos(videos);
        } catch (error) {
            videoGrid.style.display = 'block';
            container.innerHTML = `<div class="error-message">${error.message}</div>`;
        } finally {
            loadingOverlay.style.display = 'none';
        }
    }

    // 渲染视频列表
    function renderVideos(videos) {
        const container = document.getElementById('videoContainer');
        container.innerHTML = videos.map(video => `
            <div class="video-card" onclick="showPlayer(${JSON.stringify(video).replace(/"/g, '&quot;')})">
                <div class="poster-container">
                    <img class="video-poster" 
                         src="${video.cover}" 
                         alt="${video.title}"
                         onerror="this.src='https://placehold.co/400x560?text=封面加载失败'">
                </div>
                <div class="video-info">
                    <div class="video-title">${video.title}</div>
                    ${video.statusText ? `<div class="video-status">${video.statusText}</div>` : ''}
                </div>
            </div>
        `).join('');
    }

    // 播放控制
    function showPlayer(video) {
        document.body.style.overflow = 'hidden';
        const overlay = document.getElementById('playerOverlay');
        const episodeList = document.getElementById('episodeList');
        const currentTitle = document.getElementById('currentTitle');

        currentTitle.textContent = video.title;
        episodeList.innerHTML = video.playLinks.map((link, index) => `
            <button class="episode-btn ${index === 0 ? 'active' : ''}" 
                    onclick="changeEpisode(this, '${link.url}')">
                ${link.name}
            </button>
        `).join('');

        playVideo(video.playLinks[0].url);
        overlay.style.display = 'block';
    }

    function changeEpisode(button, url) {
        document.querySelectorAll('.episode-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        playVideo(url);
    }

    function playVideo(url) {
        const player = document.getElementById('videoPlayer');
        
        if (currentHls) {
            currentHls.destroy();
            currentHls = null;
        }

        if (Hls.isSupported()) {
            currentHls = new Hls();
            currentHls.loadSource(url);
            currentHls.attachMedia(player);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => player.play());
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
            player.src = url;
            player.play();
        }
    }

    function closePlayer() {
        document.body.style.overflow = '';
        document.getElementById('playerOverlay').style.display = 'none';
        if (currentHls) currentHls.destroy();
    }

    // 事件监听
    document.getElementById('searchInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') searchVideos();
    });

    // 新增：点击空白处关闭键盘（移动端优化）
    document.addEventListener('click', (e) => {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
            document.activeElement.blur();
        }
    });
    </script>
</body>
</html>
